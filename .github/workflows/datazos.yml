name: Datazos

on:
  schedule:
    - cron: "*/15 * * * *"     # cada 15 min: lee comandos, califica sugerencias y a las 20:00 Lima manda los de mañana
  workflow_dispatch:
    inputs:
      modo:
        description: "Qué hacer"
        type: choice
        default: auto
        options: [auto, manana, hoy, resumen, backtest]

permissions:
  contents: write

concurrency:
  group: datazos
  cancel-in-progress: false

jobs:
  correr:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Recuperar caché de la API
        uses: actions/cache@v4
        with:
          path: cache
          key: api-${{ github.run_id }}
          restore-keys: api-

      - name: Correr el bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MODO="${{ github.event.inputs.modo || 'auto' }}"
          if [ "$MODO" = "backtest" ]; then
            python backtest.py --telegram
          else
            python bot.py --modo "$MODO"
          fi

      - name: Guardar estado (commit y push)
        run: |
          git config user.name "datazos-bot"
          git config user.email "datazos-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sin cambios en data/"
          else
            git commit -m "Actualizar estado de datazos"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push
          fi
