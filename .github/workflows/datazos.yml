name: Datazos

on:
  schedule:
    - cron: "7 * * * *"        # respaldo: si la cadena se corta, GitHub la vuelve a prender
  workflow_dispatch:
    inputs:
      modo:
        description: "Qué hacer"
        type: choice
        default: bucle
        options: [bucle, auto, manana, hoy, resumen, backtest]

permissions:
  contents: write
  actions: write

concurrency:
  group: datazos
  cancel-in-progress: false

jobs:
  correr:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Recuperar caché de la API
        uses: actions/cache@v4
        with:
          path: cache
          key: api-${{ github.run_id }}
          restore-keys: api-

      - name: Correr el bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          git config user.name "datazos-bot"
          git config user.email "datazos-bot@users.noreply.github.com"
          MODO="${{ github.event.inputs.modo || 'bucle' }}"
          if [ "$MODO" = "backtest" ]; then
            python backtest.py --telegram
          else
            python bot.py --modo "$MODO"
          fi

      - name: Guardar estado (commit y push)
        if: always()
        run: |
          git add data/
          if git diff --cached --quiet; then
            echo "Sin cambios en data/"
          else
            git commit -m "Actualizar estado de datazos"
            git pull --rebase -X theirs origin ${{ github.ref_name }} || true
            git push || true
          fi

      - name: Relanzar (queda escuchando 24/7)
        if: ${{ !cancelled() && (github.event.inputs.modo || 'bucle') == 'bucle' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run datazos.yml --ref ${{ github.ref_name }} -f modo=bucle
